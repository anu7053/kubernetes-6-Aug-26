apiVersion: v1
kind: Pod
metadata:
  name: health-check-demo
spec:
  containers:
  - name: my-web-app
    image: nginx:latest
    ports:
    - containerPort: 8080

    # 1. LIVENESS: Restarts the container if /healthz returns an error
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 15 # Wait 15 seconds after boot before checking
      periodSeconds: 10       # Check every 10 seconds

    # 2. READINESS: Holds back user traffic if /ready is not yet working
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      initialDelaySeconds: 5  # Wait 5 seconds after boot before checking
      periodSeconds: 5        # Check every 5 seconds
